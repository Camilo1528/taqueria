<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Meseros - Taquería Pro</title>
    <link href="libs/bootstrap.min.css" rel="stylesheet" />
    <style>
      .table-btn {
        width: 100%;
        height: 112px;
        font-size: 20px;
        font-weight: 800;
        border-radius: 16px;
        background: #fff;
        color: #0f172a;
        border: 2px solid #e2e8f0;
        box-shadow: 0 1px 2px rgba(15, 23, 42, 0.06), 0 6px 20px rgba(15, 23, 42, 0.06);
        transition: transform 0.12s, box-shadow 0.15s;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 6px;
      }
      .table-btn:active {
        transform: scale(0.96);
      }
      .table-btn .estado {
        font-size: 12px;
        font-weight: 700;
        padding: 3px 10px;
        border-radius: 999px;
      }
      .table-free .estado {
        background: #d1fae5;
        color: #047857;
      }
      .table-open {
        border-color: #fca5a5;
        background: #fff7f7;
      }
      .table-open .estado {
        background: #fee2e2;
        color: #b91c1c;
      }
      .legend span {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        margin-right: 14px;
        font-size: 13px;
        color: #64748b;
      }
      .legend i {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        display: inline-block;
      }
    </style>
    <link rel="manifest" href="manifest.json" />
    <link rel="stylesheet" href="css/theme.css" />
  </head>
  <body>
    <div class="tp-topbar d-flex align-items-center justify-content-between">
      <h1 id="waiter-title">Mapa de Mesas</h1>
      <button class="btn btn-sm btn-outline-light" onclick="logout()">Salir</button>
    </div>
    <div class="container py-3">
      <div class="legend mb-3">
        <span><i style="background: #10b981"></i>Libre: toca para tomar el pedido</span>
        <span><i style="background: #ef4444"></i>Ocupada: toca para agregar más</span>
      </div>
      <div class="row g-3" id="map-container">
        <!-- JS inyecta mesas -->
      </div>
    </div>
    <script>
      const token = localStorage.getItem("token");
      if (!token) window.location.href = "login.html";

      fetch("/branding")
        .then((r) => r.json())
        .then((d) => {
          let content = (d.business_name || "Mi Restaurante") + " · Mesas";
          if (d.logo_url) {
            content =
              `<img src="${d.logo_url}" style="height: 28px; margin-right: 8px; object-fit: contain; border-radius: 6px; vertical-align: middle;">` +
              content;
          }
          document.getElementById("waiter-title").innerHTML = content;
        });

      async function loadTables() {
        const res = await fetch("/tables/status", {
          headers: { Authorization: "Bearer " + token },
        });
        if (res.status === 401) {
          localStorage.removeItem("token");
          window.location.href = "login.html";
          return;
        }
        if (!res.ok) return;
        const tablesData = (await res.json()).sort((a, b) => a.id - b.id);

        // Solo las mesas que existen en el sistema (así el pedido nunca falla por "mesa no encontrada")
        const html = tablesData
          .map((t) => {
            const isOpen = t.current_order_id !== null && t.current_order_id !== undefined;
            const cls = isOpen ? "table-open" : "table-free";
            const status = isOpen ? "Ocupada" : "Libre";
            const name = String(t.name || "Mesa " + t.id).replace(/[<>&"]/g, "");
            return `<div class="col-4 col-md-3">
                <button class="table-btn ${cls}" onclick="takeOrder(${t.id})">
                    ${name}<span class="estado">${status}</span>
                </button>
            </div>`;
          })
          .join("");
        document.getElementById("map-container").innerHTML =
          (html || '<div class="alert alert-info">No hay mesas creadas todavía. Pídele al administrador que las configure.</div>') +
          `<div class="col-12 mt-2">
             <button class="btn btn-outline-secondary w-100 fw-bold py-3" onclick="window.location.href='/customer.html?table=donacion'">
               🤝 Pedido de donación (sin cobro)
             </button>
           </div>`;
      }

      function takeOrder(table) {
        window.location.href = `/customer.html?table=${table}`;
      }

      loadTables();
      setInterval(loadTables, 5000);
    </script>
    <script src="core.js"></script>
  </body>
</html>
